:root{color-scheme:dark;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0c1e17;color:#eee9df}main{position:relative;width:100%;height:100svh;overflow:hidden;background:#173327}#scene{display:block;width:100%;height:100%;touch-action:none}.proof-ui{position:absolute;z-index:3;left:50%;bottom:20px;transform:translateX(-50%);background:#0b1c16e8;border:1px solid #c1d8b33c;box-shadow:0 20px 70px #06120c7c;border-radius:13px;backdrop-filter:blur(12px);padding:12px 14px;width:min(710px,calc(100% - 24px));display:flex;align-items:center;gap:13px;color:#f1efe8}.proof-ui button{background:#e6ded2;color:#173327;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;flex:none}.proof-ui input{min-width:60px;flex:1;accent-color:#aec8aa}.proof-ui span{font-size:11px;font-weight:700;min-width:42px;font-variant-numeric:tabular-nums} .proof-title{position:absolute;left:20px;top:16px;z-index:3;display:flex;align-items:baseline;gap:14px;max-width:calc(100% - 30px);pointer-events:none}.proof-title strong{font-family:Georgia,serif;letter-spacing:-.06em;font-size:18px}.proof-title small{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#b1c8ae;line-height:1.4} .a11y{position:absolute;z-index:4;top:52px;left:20px;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap} .fallback{position:absolute;inset:10% 10% 15%;background:#e6ded2;color:#173327;display:grid;place-items:center;text-align:center;padding:30px}body.ready .fallback{display:none}@media(max-width:650px){.proof-title{top:10px;left:12px;gap:7px;flex-direction:column}.proof-title strong{font-size:14px}.proof-title small{font-size:9px}.proof-ui{bottom:10px;gap:7px;padding:9px}.proof-ui button{padding:11px 12px}.proof-ui span{font-size:10px;min-width:32px}}
</style></head><body>
<main><canvas id="scene" aria-label="Interactive spatial proof: a deformable cream webpage reveals the existing Genezisi Work section as the camera moves forward"></canvas><div class="fallback"><p>Spatial proof requires WebGL2. The existing Genezisi CTA should retain ordinary anchor navigation when graphics support is unavailable.</p></div>
<div class="proof-title"><strong>GENEZISI</strong><small>Living Page · isolated mesh + camera proof<br>Concept / not production CTA</small></div>
<div class="proof-ui"><button id="play" type="button">Play</button><input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Scrub fold and camera progress"><span id="value">0%</span><button id="reset" type="button">Reset</button></div>
<div class="a11y" aria-live="polite" id="sr-status">Spatial transition experiment. Scrub with arrow keys or use Play.</div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),play=document.getElementById('play'),scrub=document.getElementById('progress'),value=document.getElementById('value'),reset=document.getElementById('reset');
const gl=canvas.getContext('webgl2',{antialias:true,alpha:false,depth:true,premultipliedAlpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl){play.disabled=true;scrub.disabled=true;return;}
document.body.classList.add('ready');
const vs=`#version 300 es
precision highp float;
in vec2 a_uv;
uniform float u_aspect,u_p,u_mode;
uniform mat4 u_projection;
uniform float u_cam;
out vec2 v_uv;
out float v_fold,v_depth;
float S(float a,float b,float v){float t=clamp((v-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
void main(){
  float reveal=S(.075,.90,u_p);
  bool portrait=u_aspect<.78;
  float axis=portrait?1.0-a_uv.y:a_uv.x;
  float cross=portrait?a_uv.x:a_uv.y;
  float crease=1.10-1.34*reveal;
  float wobble=.09*sin((cross*1.12+.17)*3.14159265)*sin(3.14159265*reveal)+.028*(cross-.5)*sin(3.14159265*reveal);
  float edge=crease+wobble;
  float distanceToEdge=(edge-axis)*(portrait?2.0:2.0*u_aspect);
  float band=.43;
  float t=clamp(1.0-distanceToEdge/band,0.0,1.0);
  float z=0.0;
  float x=(a_uv.x*2.0-1.0)*u_aspect;
  float y=1.0-a_uv.y*2.0;
  if(u_mode<.5){
    // True vertex displacement: material curls *out* of the screen near the
    // moving edge. The whole textured hero exists on one mesh, not two doors.
    float roll=sin(3.14159265*reveal);
    z=.46*roll*t*t*(3.0-2.0*t);
    if(portrait)y+=.10*roll*t*t;
    else x-=.10*roll*t*t;
    // A very restrained organic twist across the material, never a flat wipe.
    z+=.06*roll*sin(3.14159265*cross)*t;
  }else if(u_mode<1.5){z=-2.0;}
  else{
    // A shallow curled underside built from the same contour, not separate
    // corridor geometry. Texcoord.x is an angle around the rolled material.
    float k=portrait?a_uv.y:a_uv.x;
    float theta=k*2.4;
    float radius=(.048+.064*sin(3.14159265*reveal));
    if(portrait)y=(edge*2.0-1.0)+radius*sin(theta);
    else x=(edge*2.0-1.0)*u_aspect+radius*sin(theta);
    z=.46*sin(3.14159265*reveal)+radius*(1.0-cos(theta));
  }
  v_uv=a_uv;
  v_fold=distanceToEdge;
  v_depth=z;
  vec4 v=vec4(x,y,z-u_cam,1.0);
  gl_Position=u_projection*v;
}`;
const fs=`#version 300 es
precision highp float;
in vec2 v_uv;in float v_fold,v_depth;
uniform sampler2D u_hero,u_work;
uniform float u_p,u_mode,u_aspect;
out vec4 color;
float S(float a,float b,float v){float t=clamp((v-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
void main(){
 float reveal=S(.075,.90,u_p);
 bool portrait=u_aspect<.78;
 float axis=portrait?1.0-v_uv.y:v_uv.x;
 float cross=portrait?v_uv.x:v_uv.y;
 float edge=1.10-1.34*reveal + .09*sin((cross*1.12+.17)*3.14159265)*sin(3.14159265*reveal)+.028*(cross-.5)*sin(3.14159265*reveal);
 if(u_mode<.5 && axis>edge)discard;
 if(u_mode>1.5){
   if(reveal<.015||reveal>.995)discard;
   float light=.42+.42*cos(v_uv.x*2.3);
   color=vec4(mix(vec3(.08,.20,.13),vec3(.91,.85,.72),light),1.0);return;
 }
 if(u_mode>0.5){color=texture(u_work,v_uv);return;}
 vec3 paper=vec3(.9019,.8706,.8235);
 vec3 hero=texture(u_hero,v_uv).rgb;
 float ink=1.0-S(.10,.34,u_p);
 vec3 pigment=mix(paper,hero,ink);
 float rim=exp(-pow((v_fold-.17)/.18,2.0));
 float shelf=exp(-pow((v_fold-.43)/.35,2.0));
 float foldEnergy=sin(3.14159265*reveal);
 float shade=.27*foldEnergy*shelf;
 float highlight=.16*foldEnergy*rim;
 pigment=pigment*(1.0-shade)+vec3(.9,.85,.7)*highlight;
 color=vec4(pigment,1.0);
}`;
const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader;};
const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vs));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const loc={uv:gl.getAttribLocation(program,'a_uv'),aspect:gl.getUniformLocation(program,'u_aspect'),progress:gl.getUniformLocation(program,'u_p'),mode:gl.getUniformLocation(program,'u_mode'),proj:gl.getUniformLocation(program,'u_projection'),cam:gl.getUniformLocation(program,'u_cam')};
const mx=96,my=52,verts=[],inds=[];
for(let j=0;j<=my;j++)for(let i=0;i<=mx;i++)verts.push(i/mx,j/my);
for(let j=0;j<my;j++)for(let i=0;i<mx;i++){let a=j*(mx+1)+i,b=a+1,c=a+mx+1,d=c+1;inds.push(a,c,b,b,c,d);}
const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);gl.vertexAttribPointer(loc.uv,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(loc.uv);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(inds),gl.STATIC_DRAW);gl.bindVertexArray(null);
const textCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')];};
const WRK='#16251d',INK='#173327',PAPER='#e6ded2';
function print(ctx,text,x,y,font,color,align='left'){ctx.font=font;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.textAlign='left';}
function drawTexture(viewW,viewH,type){
 const c=document.createElement('canvas');c.width=Math.round(viewW);c.height=Math.round(viewH);const g=c.getContext('2d');const w=c.width,h=c.height;
 const mobile=w<700,scale=Math.max(.8,Math.min(1.25,w/1400));
 g.fillStyle=type==='hero'?PAPER:'#f0ece5';g.fillRect(0,0,w,h);
 if(type==='hero'){
  const pad=mobile?20:Math.max(30,w*.05);
  g.strokeStyle='#17332726';g.lineWidth=1;g.beginPath();g.moveTo(0,mobile?68:73);g.lineTo(w,mobile?68:73);g.stroke();
  print(g,'GENEZISI',pad,mobile?37:45,`900 ${mobile?19:24}px Arial`,INK);
  if(!mobile){print(g,'Work',w-420,45,'700 12px Arial',INK);print(g,'Services',w-330,45,'700 12px Arial',INK);print(g,'Start a project   ↗',w-185,45,'700 12px Arial',INK);}
  const cy=mobile?h*.40:h*.38;
  print(g,'D I G I T A L   S O L U T I O N S   S T U D I O',w/2,cy-(mobile?100:158),`700 ${mobile?9:12}px Arial`,'#6d816e','center');
  const f=mobile?Math.min(58,w*.118):Math.min(92,w*.064);
  print(g,'Your website',w/2,cy-(mobile?45:55),`900 ${f}px Arial`,INK,'center');
  print(g,'is only the',w/2,cy+f*.04,`900 ${f}px Arial`,INK,'center');
  print(g,'beginning.',w/2,cy+f*.98,`italic ${f*1.03}px Georgia`,'#6d816e','center');
  const first=cy+f*1.9;
  print(g,'We build websites, create AI systems,',w/2,first,`${mobile?12:17}px Arial`,'#586a5b','center');
  print(g,'and automate everyday tasks.',w/2,first+(mobile?20:27),`${mobile?12:17}px Arial`,'#586a5b','center');
  print(g,'Choose one service or combine them.',w/2,first+(mobile?40:54),`${mobile?12:17}px Arial`,'#586a5b','center');
  let btnY=first+(mobile?64:82);g.fillStyle=INK;g.beginPath();g.roundRect(w/2-(mobile?110:186),btnY,mobile?124:173,45,23);g.fill();
  print(g,'Explore our work   ↗',w/2-(mobile?100:170),btnY+28,`700 ${mobile?9:12}px Arial`,'white');
  g.strokeStyle='#a3b29f';g.beginPath();g.roundRect(w/2+(mobile?22:0),btnY,mobile?110:162,45,23);g.stroke();
  print(g,'Start a project  ↗',w/2+(mobile?31:14),btnY+28,`700 ${mobile?9:12}px Arial`,INK);
  g.strokeStyle='#1733272b';g.beginPath();g.moveTo(pad,h-50);g.lineTo(w-pad,h-50);g.stroke();print(g,'GENEZISI / 2026',pad,h-23,'700 10px Arial','#6d816e');
  if(!mobile)print(g,'WEBSITES · AUTOMATION · AI SYSTEMS',w/2,h-23,'700 10px Arial','#6d816e','center');
 }else{
  let pad=mobile?25:Math.max(55,w*.05),top=mobile?80:100;
  print(g,'S E L E C T E D   W O R K',pad,top,'700 12px Arial','#718472');
  const f=mobile?Math.min(66,w*.12):Math.min(85,w*.065);
  print(g,'The work',pad,top+f+30,`900 ${f}px Arial`,WRK);
  print(g,'speaks.',pad,top+f*2+17,`900 ${f}px Arial`,WRK);
  const subY=top+f*2+70;
  const paragraphs=mobile?['Three actual project destinations','from the existing Genezisi work','preview. No new projects added.']:['Three actual project destinations sourced from Genezisi’s existing','SelectedWork component. This isolated proof mirrors their names.'];
  paragraphs.forEach((line,i)=>print(g,line,pad,subY+22*i,`${mobile?12:16}px Arial`,'#718472'));
  let start=mobile?subY+120:subY+92;g.strokeStyle='#1834273e';g.beginPath();g.moveTo(pad,start-28);g.lineTo(w-pad,start-28);g.stroke();
  for(const [i,name] of ['TK Counsel','Frankencoin Desk','Her House Pilates'].entries()){
    const x=mobile?pad:pad+i*((w-2*pad)/3),y=mobile?start+i*90:start;
    const cw=mobile?w-2*pad:(w-2*pad)/3-18;
    g.strokeStyle='#1834274b';g.beginPath();g.moveTo(x,y);g.lineTo(x+cw,y);g.stroke();
    print(g,name+'  ↗',x,y+35,`700 ${mobile?19:Math.min(31,w*.024)}px Arial`,WRK);
    print(g,'View project website',x,y+55,`${mobile?11:13}px Arial`,'#627566');
  }
 }
 return c;
}
const makeTex=(image)=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);return t;};
let textures=[null,null],aspect=1,p=0,playing=false,previous=0,raf=0;
function perspective(a){const z=4.6,f=1/Math.tan(Math.atan(1/z));const near=.1,far=30;return new Float32Array([f/a,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,(2*far*near)/(near-far),0]);}
function rebuild(){const rect=canvas.getBoundingClientRect(),w=Math.max(1,Math.round(rect.width)),h=Math.max(1,Math.round(rect.height));const dpr=Math.min(window.devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);aspect=w/h;textures.forEach(t=>t&&gl.deleteTexture(t));textures=[makeTex(drawTexture(w,h,'hero')),makeTex(drawTexture(w,h,'work'))];draw();}
function draw(){gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.075,.16,.11,1);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.useProgram(program);gl.uniform1f(loc.aspect,aspect);gl.uniform1f(loc.progress,p);gl.uniformMatrix4fv(loc.proj,false,perspective(aspect));const s=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};gl.uniform1f(loc.cam,4.6-2.0*s(.24,.94,p));gl.bindVertexArray(vao);
 // Dest stays in the same world coordinates for the entire sequence.
 for(const mode of [1,2,0]){gl.uniform1f(loc.mode,mode);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,mode===1?textures[1]:textures[0]);gl.drawElements(gl.TRIANGLES,inds.length,gl.UNSIGNED_SHORT,0);}gl.bindVertexArray(null);
 value.textContent=Math.round(p*100)+'%';scrub.value=Math.round(p*1000);
}
function tick(now){if(!playing)return;const dt=Math.min(.05,Math.max(0,(now-previous)/1000));previous=now;const duration=1.35;p=Math.min(1,p+dt/duration);draw();if(p>=1){playing=false;play.textContent='Replay';return;}raf=requestAnimationFrame(tick);}
play.onclick=()=>{if(playing){playing=false;cancelAnimationFrame(raf);play.textContent='Resume';return;}if(p>=1)p=0;playing=true;previous=performance.now();play.textContent='Pause';raf=requestAnimationFrame(tick);};
scrub.oninput=()=>{playing=false;cancelAnimationFrame(raf);p=Number(scrub.value)/1000;play.textContent=p>=1?'Replay':'Play';draw();};
reset.onclick=()=>{playing=false;cancelAnimationFrame(raf);p=0;play.textContent='Play';draw();};
window.addEventListener('resize',rebuild);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&playing){play.click();}});
rebuild();if(new URLSearchParams(location.search).has('autoplay'))play.click();
window.__proof={setProgress(t){playing=false;cancelAnimationFrame(raf);p=Math.max(0,Math.min(1,t));draw()},get progress(){return p},get rendering(){return !!gl}};
})();
</script></body></html>
