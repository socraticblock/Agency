<!doctype html>
<!--
  Scroll-scrub hero source — the "system blueprint" clip.

  Why this exists
  ---------------
  The plan was a MiniMax H3 text-to-video clip for the scroll-scrubbed hero.
  The account hit its Token Plan limit (402 insufficient_balance_error), and a
  generative model is the wrong tool for this anyway: it cannot render legible
  interface, and this studio sells interface. So the clip is rendered locally
  and deterministically instead.

  What it draws
  -------------
  The site's own workflow, as a system diagram that assembles itself:
  a blueprint grid, five stations (request -> understand -> action -> human
  review -> delivery) joined by one routed path, and a signal that travels the
  path, lighting each station as it arrives. A browser frame closes around it
  at the end.

  Why a signal on a path
  ----------------------
  The scroll-scrubbed hero (see techniques/video-and-media.md #7) puts a
  fixed background behind a sparse editorial layer, so this clip must stay
  LOW CONTRAST and must not fight the DOM panels on top of it. A routed signal
  gives the eye somewhere to travel, survives heavy downscaling to 960px, and
  reads as "automation" without a single word of copy.

  Determinism
  -----------
  Every value is a pure function of `p` (0..1) and a seeded PRNG. No
  Math.random, no Date.now, no CSS animations — a frame captured at p=0.42 is
  identical on every run, which is what makes the frame-cache scrub repeatable.
-->
<meta charset="utf-8" />
<title>scroll scrub source</title>
<style>
  html,body{margin:0;padding:0;background:#02060b;overflow:hidden}
  canvas{display:block;width:1440px;height:810px}
</style>
<canvas id="c" width="1440" height="810"></canvas>
<script>
const W = 1440, H = 810;
const c = document.getElementById('c');
const ctx = c.getContext('2d', { alpha: false });

const CYAN = [125, 232, 255];
const INK = '#02060b';

// Seeded PRNG — deterministic across runs.
let _s = 0x2f6e2b1;
function rnd() {
  _s ^= _s << 13; _s >>>= 0;
  _s ^= _s >> 17;
  _s ^= _s << 5;  _s >>>= 0;
  return _s / 4294967296;
}

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smoothstep = (e0, e1, v) => { const x = clamp((v - e0) / (e1 - e0)); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;

// Five stations, matching the site's workflow copy.
const STATIONS = [
  { x: 0.145, label: 'request' },
  { x: 0.330, label: 'understand' },
  { x: 0.520, label: 'action' },
  { x: 0.705, label: 'human' },
  { x: 0.875, label: 'delivery' },
];
const Y = 0.545;

// Rounded rect path.
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function draw(p) {
  _s = 0x2f6e2b1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // ---- backdrop -----------------------------------------------------------
  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 40, W * 0.5, H * 0.5, W * 0.78);
  g.addColorStop(0, 'rgba(24,92,120,0.20)');
  g.addColorStop(0.55, 'rgba(10,44,64,0.07)');
  g.addColorStop(1, 'rgba(2,6,11,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // ---- blueprint grid -----------------------------------------------------
  const cols = 16, rows = 9;
  const gridIn = smoothstep(0.0, 0.22, p);
  const gridFade = 1 - smoothstep(0.78, 1.0, p) * 0.35;
  ctx.lineWidth = 1;
  for (let i = 1; i < cols; i++) {
    const x = Math.round((W / cols) * i) + 0.5;
    ctx.strokeStyle = rgba(CYAN, 0.045 * gridIn * gridFade);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let j = 1; j < rows; j++) {
    const y = Math.round((H / rows) * j) + 0.5;
    ctx.strokeStyle = rgba(CYAN, 0.045 * gridIn * gridFade);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // A slow vertical scan that sweeps once as the clip plays.
  const scan = clamp(p * 1.25);
  if (scan > 0 && scan < 1) {
    const sx = scan * W;
    const lg = ctx.createLinearGradient(sx - 190, 0, sx + 190, 0);
    lg.addColorStop(0, rgba(CYAN, 0));
    lg.addColorStop(0.5, rgba(CYAN, 0.055 * gridIn));
    lg.addColorStop(1, rgba(CYAN, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(sx - 190, 0, 380, H);
    ctx.strokeStyle = rgba(CYAN, 0.22 * gridIn);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }

  // ---- route --------------------------------------------------------------
  // The signal runs along a slightly routed path: down from the first station,
  // across, and up into the last — so the route reads as a process, not a line.
  const pts = STATIONS.map((s, i) => ({
    x: s.x * W,
    y: Y * H + (i % 2 === 0 ? -Math.sin(i * 1.7) * 26 : Math.sin(i * 2.3) * 30),
  }));

  const routeIn = smoothstep(0.06, 0.30, p);
  const routeOut = 1 - smoothstep(0.86, 1.0, p) * 0.25;
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = rgba(CYAN, 0.20 * routeIn * routeOut);

  // Path segments (quadratic through control points above the line).
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const prev = pts[i - 1], cur = pts[i];
    const mx = (prev.x + cur.x) / 2;
    ctx.quadraticCurveTo(mx, prev.y, cur.x, cur.y);
  }
  ctx.stroke();

  // ---- stations -----------------------------------------------------------
  const R = 13;
  for (let i = 0; i < STATIONS.length; i++) {
    const st = STATIONS[i];
    const sx = st.x * W, sy = Y * H + (i % 2 === 0 ? -Math.sin(i * 1.7) * 26 : Math.sin(i * 2.3) * 30);

    // The signal reaches station i at this progress.
    const reach = 0.10 + (i / (STATIONS.length - 1)) * 0.62;
    const lit = smoothstep(reach, reach + 0.07, p);
    const appear = smoothstep(0.02 + i * 0.05, 0.14 + i * 0.05, p);

    // Outer ring
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = rgba(CYAN, (0.22 + 0.55 * lit) * appear * routeOut);
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, Math.PI * 2); ctx.stroke();

    // Inner disc
    ctx.fillStyle = rgba(CYAN, (0.10 + 0.55 * lit) * appear * routeOut);
    ctx.beginPath(); ctx.arc(sx, sy, R * 0.42, 0, Math.PI * 2); ctx.fill();

    // Halo on arrival
    if (lit > 0.02) {
      const hr = R + 9 + 16 * lit;
      const hg = ctx.createRadialGradient(sx, sy, R * 0.4, sx, sy, hr);
      hg.addColorStop(0, rgba(CYAN, 0.16 * lit * routeOut));
      hg.addColorStop(1, rgba(CYAN, 0));
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(sx, sy, hr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- travelling signal --------------------------------------------------
  // A bright dot rides the route from station 0 to the last.
  const head = clamp((p - 0.10) / 0.62);
  if (head > 0 && head < 1) {
    // Walk the same quadratic path.
    const segs = pts.length - 1;
    const t = head * segs;
    const si = Math.min(segs - 1, Math.floor(t));
    const lt = t - si;
    const prev = pts[si], cur = pts[si + 1];
    const mx = (prev.x + cur.x) / 2;
    const bx = (1 - lt) * (1 - lt) * prev.x + 2 * (1 - lt) * lt * mx + lt * lt * cur.x;
    const by = (1 - lt) * (1 - lt) * prev.y + 2 * (1 - lt) * lt * prev.y + lt * lt * cur.y;

    const trail = ctx.createRadialGradient(bx, by, 0, bx, by, 74);
    trail.addColorStop(0, rgba(CYAN, 0.42 * routeOut));
    trail.addColorStop(0.35, rgba(CYAN, 0.11 * routeOut));
    trail.addColorStop(1, rgba(CYAN, 0));
    ctx.fillStyle = trail;
    ctx.beginPath(); ctx.arc(bx, by, 74, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = `rgba(226,252,255,${0.95 * routeOut})`;
    ctx.beginPath(); ctx.arc(bx, by, 3.4, 0, Math.PI * 2); ctx.fill();
  }

  // ---- floating data motes ------------------------------------------------
  const motes = 54;
  for (let i = 0; i < motes; i++) {
    const mx = rnd() * W, my = rnd() * H;
    const sp = 0.10 + rnd() * 0.5;
    const ph = rnd();
    const a = 0.05 + 0.16 * rnd();
    const y = (my - p * sp * 90) % H;
    const yy = y < 0 ? y + H : y;
    const tw = 0.55 + 0.45 * Math.sin((p * 3 + ph) * Math.PI * 2);
    ctx.fillStyle = rgba(CYAN, a * tw * (0.35 + 0.65 * smoothstep(0.0, 0.3, p)));
    ctx.beginPath(); ctx.arc(mx, yy, 1.5 + rnd() * 1.1, 0, Math.PI * 2); ctx.fill();
  }

  // ---- browser frame closing in ------------------------------------------
  const frameIn = smoothstep(0.62, 0.92, p);
  if (frameIn > 0.01) {
    const mx = 96, my = 74, bw = W - 192, bh = H - 148;
    ctx.strokeStyle = rgba(CYAN, 0.20 * frameIn);
    ctx.lineWidth = 1.2;
    rr(mx, my, bw, bh, 18);
    ctx.stroke();
    // title bar
    ctx.beginPath();
    ctx.moveTo(mx, my + 40); ctx.lineTo(mx + bw, my + 40);
    ctx.strokeStyle = rgba(CYAN, 0.13 * frameIn);
    ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = rgba(CYAN, 0.26 * frameIn);
      ctx.beginPath(); ctx.arc(mx + 24 + i * 15, my + 20, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    // a url bar line
    ctx.fillStyle = rgba(CYAN, 0.10 * frameIn);
    rr(mx + 92, my + 12, 210, 16, 8); ctx.fill();
  }

  // ---- final resolve ------------------------------------------------------
  // At the very end the whole thing brightens once: the "delivered" beat.
  const resolve = smoothstep(0.88, 1.0, p);
  if (resolve > 0.01) {
    const fg = ctx.createRadialGradient(W * 0.5, Y * H, 30, W * 0.5, Y * H, W * 0.55);
    fg.addColorStop(0, rgba(CYAN, 0.10 * resolve));
    fg.addColorStop(1, rgba(CYAN, 0));
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, W, H);
  }
}

window.setProgress = draw;
window.__ready = true;
draw(0);
</script>
